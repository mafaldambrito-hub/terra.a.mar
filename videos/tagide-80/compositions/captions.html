  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">

  <script>
    const tl = gsap.timeline({ paused: true });

    const groups = Array.from(document.querySelectorAll("#cap-card .cap-group"));
    groups.forEach((g, i) => {
      const start = parseFloat(g.dataset.start);
      const end = start + parseFloat(g.dataset.duration);
      const words = g.querySelectorAll(".w");
      if (i === 0) {
        // Frame 0 is the thumbnail: the hook line is already on screen
        tl.set(words, { opacity: 1, scale: 1, y: 0 }, 0);
      } else {
        tl.fromTo(
          words,
          { opacity: 0, scale: 0.55, y: 26, rotation: (k) => (k % 2 ? 4 : -4) },
          { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.34, ease: "back.out(2.2)", stagger: 0.08 },
          start,
        );
        // card bumps on each new beat
        tl.fromTo("#cap-card", { scale: 0.965 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, start);
      }
      if (i < groups.length - 1) {
        tl.to(words, { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, end - 0.12);
      }
    });

    // The 80 gets a terracotta highlighter sweep + slam
    tl.set("#cap-80", { color: "#2a1e18" }, 0);
    tl.fromTo("#cap-80-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, 0.62);
    tl.set("#cap-80", { color: "#f6efe8" }, 0.7);
    tl.fromTo("#cap-80", { scale: 1.45 }, { scale: 1, duration: 0.4, ease: "back.out(2.5)", immediateRender: false }, 0.7);

    // White flashes on the cuts
    [3.2, 9.9333, 14.4].forEach((t) => {
      tl.fromTo("#cap-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
    });

    // Outro: the last caption leaves, then the card floods the frame and becomes the end card
    const last = groups[groups.length - 1];
    tl.to(last.querySelectorAll(".w"), { opacity: 0, filter: "blur(6px)", duration: 0.12, ease: "power2.in" }, 22.18);
    tl.to(["#cap-kicker-left", "#cap-kicker-right", "#cap-rule"], { opacity: 0, duration: 0.12 }, 22.18);
    tl.set("#cap-flood", { opacity: 1 }, 22.3);
    tl.set("#cap-card", { opacity: 0 }, 22.3);
    tl.fromTo(
      "#cap-flood",
      { clipPath: "inset(318px 70px 1370px 70px round 34px)" },
      { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.4, ease: "power3.in", immediateRender: false },
      22.3,
    );

    window.__timelines["captions"] = tl;
  </script>
