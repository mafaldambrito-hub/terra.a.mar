<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      :root {
        --cream: #f6efe8;
        --terracotta: #9c4f33;
        --ink: #2a1e18;
        --teal: #2f6670;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Camera wrapper: punch-ins scale around the caption band so the card always sits over the same spot */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 540px 425px;
      }
      #cam video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25.9"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <!-- Rooftops + statue: Tágide turns 80 -->
        <video id="v-rooftops" class="clip" src="assets/tagide.mp4" muted playsinline
          data-start="0" data-duration="3.2" data-media-start="0.0333" data-track-index="0"></video>
        <!-- Walk along the table, sped up -->
        <video id="v-table-walk" class="clip" src="assets/tagide.mp4" muted playsinline
          data-start="3.2" data-duration="6.7333" data-media-start="3.2333" data-playback-rate="1.29208"
          data-track-index="0"></video>
        <!-- Close-ups of the pieces, real speed -->
        <video id="v-pieces" class="clip" src="assets/tagide.mp4" muted playsinline
          data-start="9.9333" data-duration="4.4667" data-media-start="11.9333" data-track-index="0"></video>
        <!-- Whip to the view over Lisbon, sped up -->
        <video id="v-view" class="clip" src="assets/tagide.mp4" muted playsinline
          data-start="14.4" data-duration="8.3333" data-media-start="16.4" data-playback-rate="1.504"
          data-track-index="0"></video>
        <!-- t.a.m end card -->
        <video id="v-endcard" class="clip" src="assets/tagide.mp4" muted playsinline
          data-start="22.7333" data-duration="3.1667" data-media-start="28.9333" data-track-index="0"></video>
      </div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-track-kind="captions" data-start="0" data-duration="22.7333" data-track-index="1" data-width="1080" data-height="1920"
        style="z-index: 2"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-track-kind="graphics" data-start="22.7333" data-duration="3.1667" data-track-index="2" data-width="1080" data-height="1920"
        style="z-index: 3"></div>

      <!-- Sound design: bundled Pixabay SFX -->
      <audio id="sfx-impact-80" src="assets/sfx/impact-bass-1.mp3" data-start="0.7" data-duration="2.1" data-volume="0.8" data-track-index="3"></audio>
      <audio id="sfx-whoosh-lunch" src="assets/sfx/whoosh-short.mp3" data-start="3.09" data-duration="0.57" data-volume="0.7" data-track-index="4"></audio>
      <audio id="sfx-pop-lunch" src="assets/sfx/pop.mp3" data-start="3.24" data-duration="0.5" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-pop-lisbon" src="assets/sfx/pop.mp3" data-start="5.3" data-duration="0.5" data-volume="0.55" data-track-index="5"></audio>
      <audio id="sfx-pop-table" src="assets/sfx/pop.mp3" data-start="7.6" data-duration="0.5" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-whoosh-pieces" src="assets/sfx/whoosh.mp3" data-start="9.8" data-duration="0.57" data-volume="0.7" data-track-index="4"></audio>
      <audio id="sfx-impact-pieces" src="assets/sfx/impact-bass-1.mp3" data-start="9.9333" data-duration="2" data-volume="0.55" data-track-index="3"></audio>
      <audio id="sfx-pop-hand" src="assets/sfx/pop.mp3" data-start="12.15" data-duration="0.5" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-whoosh-view" src="assets/sfx/whoosh-short.mp3" data-start="14.3" data-duration="0.57" data-volume="0.7" data-track-index="4"></audio>
      <audio id="sfx-pop-years" src="assets/sfx/pop.mp3" data-start="16.8" data-duration="0.5" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-pop-portugal" src="assets/sfx/pop.mp3" data-start="19.7" data-duration="0.5" data-volume="0.55" data-track-index="5"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="20.4" data-duration="2.35" data-volume="0.45" data-fade-in="0.6" data-track-index="6"></audio>
      <audio id="sfx-whoosh-end" src="assets/sfx/whoosh.mp3" data-start="22.3" data-duration="0.57" data-volume="0.75" data-track-index="4"></audio>
      <audio id="sfx-sparkle-cta" src="assets/sfx/sparkle.mp3" data-start="23.35" data-duration="1.8" data-volume="0.6" data-track-index="7"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#cam";

      // Hard punch-ins on each caption beat (jump-zoom TikTok style)
      tl.set(cam, { scale: 1 }, 0);
      tl.set(cam, { scale: 1.08 }, 0.7);
      // shake as the 80 lands
      tl.fromTo(cam, { x: 0, y: 0 }, { keyframes: [{ x: -10, y: 6 }, { x: 8, y: -5 }, { x: -5, y: 3 }, { x: 0, y: 0 }], duration: 0.22, ease: "none" }, 0.7);
      tl.set(cam, { scale: 1 }, 3.2);
      tl.set(cam, { scale: 1.12 }, 5.3);
      tl.set(cam, { scale: 1 }, 7.6);
      // cut to the close-ups: comes in large and settles
      tl.fromTo(cam, { scale: 1.16 }, { scale: 1.04, duration: 0.5, ease: "power4.out", immediateRender: false }, 9.9333);
      tl.set(cam, { scale: 1.12 }, 12.15);
      tl.set(cam, { scale: 1 }, 14.4);
      tl.set(cam, { scale: 1.1 }, 16.8);
      tl.set(cam, { scale: 1.18 }, 19.7);
      tl.set(cam, { scale: 1 }, 22.7333);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
